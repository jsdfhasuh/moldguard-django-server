server {
    listen 80;
    listen [::]:80;
    listen 127.0.0.1:8443 ssl http2;
    listen 127.0.0.1:18443 ssl http2 proxy_protocol;

    server_name moldguard.oracle.19970219.xyz 161.118.244.30;

    ssl_certificate /etc/nginx/ssl/oracle.19970219.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/oracle.19970219.xyz.key;

    access_log /var/log/nginx/moldguard_access.log main;
    error_log /var/log/nginx/moldguard_error.log warn;

    error_page 497 =301 https://$host$request_uri;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_redirect off;
    }
}
