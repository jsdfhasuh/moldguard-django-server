name: moldguard-competition

services:
  mariadb:
    image: mariadb:11.8
    container_name: moldguard-competition-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_INITDB_SKIP_TZINFO: "1"
    volumes:
      - ./runtime/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  api:
    build:
      context: .
    image: moldguard-competition-server:${MOLDGUARD_IMAGE_TAG:-local}
    container_name: moldguard-competition-api
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_DB_ENGINE: mariadb
      DJANGO_DB_HOST: mariadb
      DJANGO_DB_PORT: "3306"
      DJANGO_DB_NAME: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      DJANGO_DB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      DJANGO_DB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MOLDGUARD_PUBLIC_BASE_URL: ${MOLDGUARD_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      MOLDGUARD_KNOWLEDGE_VERSION: MOLDGUARD-KB-1.2
      MOLDGUARD_REPORT_SCHEMA_VERSION: REPORT-FORM-1.1
      DEMO_EMPLOYEE_1_EMAIL: ${DEMO_EMPLOYEE_1_EMAIL:-demo-injection@example.com}
      DEMO_EMPLOYEE_2_EMAIL: ${DEMO_EMPLOYEE_2_EMAIL:-demo-sheet-metal@example.com}
      DEMO_EMPLOYEE_3_EMAIL: ${DEMO_EMPLOYEE_3_EMAIL:-demo-unavailable@example.com}
      DEMO_EMPLOYEE_4_EMAIL: ${DEMO_EMPLOYEE_4_EMAIL:-demo-high-load@example.com}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/api/v1/health', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

networks:
  backend:
    driver: bridge
