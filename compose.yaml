services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_INITDB_SKIP_TZINFO: "1"
    volumes:
      - ${MOLDGUARD_RUNTIME_DIR:-./runtime/competition}/mariadb:/var/lib/mysql
    ports:
      - "${MARIADB_HOST_BIND:-127.0.0.1}:${MARIADB_HOST_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  api:
    build:
      context: .
    image: moldguard-competition-server:${MOLDGUARD_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DB_ENGINE: mariadb
      DJANGO_DB_HOST: mariadb
      DJANGO_DB_PORT: "3306"
      DJANGO_DB_NAME: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      DJANGO_DB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      DJANGO_DB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MOLDGUARD_PUBLIC_BASE_URL: ${MOLDGUARD_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
      MOLDGUARD_HOST_PORT: ${MOLDGUARD_HOST_PORT:-18081}
      MOLDGUARD_KNOWLEDGE_VERSION: MOLDGUARD-KB-1.2
      MOLDGUARD_REPORT_SCHEMA_VERSION: REPORT-FORM-1.1
      MOLDGUARD_ABNORMAL_OVERDUE_HOURS: ${MOLDGUARD_ABNORMAL_OVERDUE_HOURS:-4}
      DJANGO_MEDIA_ROOT: /app/media
      MOLDGUARD_REPORT_REVIEW_WEBHOOK_URL: ${MOLDGUARD_REPORT_REVIEW_WEBHOOK_URL:-}
      MOLDGUARD_REPORT_REVIEW_WEBHOOK_TIMEOUT: ${MOLDGUARD_REPORT_REVIEW_WEBHOOK_TIMEOUT:-10}
      MOLDGUARD_REPORT_MAX_IMAGES: ${MOLDGUARD_REPORT_MAX_IMAGES:-10}
      MOLDGUARD_REPORT_IMAGE_MAX_BYTES: ${MOLDGUARD_REPORT_IMAGE_MAX_BYTES:-8388608}
      DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE: ${DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE:-100663296}
      MOLDGUARD_AI_REVIEW_MIN_CONFIDENCE: ${MOLDGUARD_AI_REVIEW_MIN_CONFIDENCE:-0.7500}
      EMAIL_BACKEND: ${EMAIL_BACKEND:?set EMAIL_BACKEND in .env}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-15}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set DEFAULT_FROM_EMAIL in .env}
      EMAIL_MESSAGE_ID_DOMAIN: ${EMAIL_MESSAGE_ID_DOMAIN:?set EMAIL_MESSAGE_ID_DOMAIN in .env}
      MOLDGUARD_REQUIRE_SMTP: "true"
      MOLDGUARD_SMTP_DELIVERY_VERIFIED: ${MOLDGUARD_SMTP_DELIVERY_VERIFIED:-false}
      DEMO_EMPLOYEE_1_EMAIL: ${DEMO_EMPLOYEE_1_EMAIL:-demo-injection@example.com}
      DEMO_EMPLOYEE_2_EMAIL: ${DEMO_EMPLOYEE_2_EMAIL:-demo-sheet-metal@example.com}
      DEMO_EMPLOYEE_3_EMAIL: ${DEMO_EMPLOYEE_3_EMAIL:-demo-unavailable@example.com}
      DEMO_EMPLOYEE_4_EMAIL: ${DEMO_EMPLOYEE_4_EMAIL:-demo-high-load@example.com}
    volumes:
      - ${MOLDGUARD_RUNTIME_DIR:-./runtime/competition}/media:/app/media
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${MOLDGUARD_HOST_BIND:-127.0.0.1}:${MOLDGUARD_HOST_PORT:-18081}:18080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/api/v1/health', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/staticfiles:size=32m,mode=0755,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

networks:
  backend:
    driver: bridge
