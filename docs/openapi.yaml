components:
  schemas:
    AbnormalItem:
      type: object
      properties:
        item:
          type: string
          maxLength: 500
          minLength: 1
        description:
          type: string
          maxLength: 2000
          minLength: 1
      required:
      - description
      - item
    AbnormalNextActionEnum:
      enum:
      - CONTINUE_PROCESSING
      - CREATE_REPAIR_TASK
      type: string
      description: |-
        * `CONTINUE_PROCESSING` - CONTINUE_PROCESSING
        * `CREATE_REPAIR_TASK` - CREATE_REPAIR_TASK
    AlertScan:
      type: object
      properties:
        client_request_id:
          type: string
          maxLength: 120
        mold_ids:
          type: array
          items:
            type: string
            maxLength: 64
      required:
      - client_request_id
    Assign:
      type: object
      properties:
        client_request_id:
          type: string
          maxLength: 120
        employee_id:
          type: string
          maxLength: 64
      required:
      - client_request_id
      - employee_id
    BlankEnum:
      enum:
      - ''
    ClientRequest:
      type: object
      properties:
        client_request_id:
          type: string
          maxLength: 120
      required:
      - client_request_id
    DecisionEnum:
      enum:
      - COMPLETE
      - ABNORMAL
      - NEEDS_MORE_INFO
      type: string
      description: |-
        * `COMPLETE` - COMPLETE
        * `ABNORMAL` - ABNORMAL
        * `NEEDS_MORE_INFO` - NEEDS_MORE_INFO
    InspectionResult:
      type: object
      properties:
        knowledge_id:
          type: string
          maxLength: 120
        result:
          $ref: '#/components/schemas/ResultEnum'
        not_applicable_reason:
          type: string
          default: ''
          maxLength: 2000
        abnormal_note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - knowledge_id
      - result
    Knowledge:
      type: object
      properties:
        client_request_id:
          type: string
          maxLength: 120
        knowledge_snapshot_version:
          type: string
          maxLength: 64
        catalog_version:
          type: string
          writeOnly: true
          maxLength: 64
        title:
          type: string
          default: ''
          maxLength: 240
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeItem'
        safety_notes:
          type: array
          items:
            type: string
            maxLength: 2000
        source_documents:
          type: array
          items:
            type: string
            maxLength: 500
      required:
      - client_request_id
      - items
    KnowledgeItem:
      type: object
      properties:
        knowledge_id:
          type: string
          maxLength: 120
        item:
          type: string
          maxLength: 500
        criteria:
          type: string
          default: ''
          maxLength: 2000
        method:
          type: string
          default: ''
          maxLength: 200
        required:
          type: boolean
        title:
          type: string
          maxLength: 240
        knowledge_type:
          type: string
